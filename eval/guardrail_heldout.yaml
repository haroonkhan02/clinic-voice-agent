# Held-out caller utterances for the guardrails, written on 2026-10-15 without looking at the
# patterns in guardrails.py and scored once. They are not used to change the patterns: misses
# are reported as they are. Same style as guardrail_utterances.yaml (lower case, STT-like).
# label: emergency | medical_advice | ok
utterances:
  # --- emergency ---
  - {text: "my wife just fainted and she's not responding", label: emergency}
  - {text: "my chest feels really tight and the pain goes down my arm", label: emergency}
  - {text: "my baby is turning blue", label: emergency}
  - {text: "i can't catch my breath at all", label: emergency}
  - {text: "my father fell down the stairs and he's unconscious", label: emergency}
  - {text: "he swallowed a whole bottle of paracetamol", label: emergency}
  - {text: "my arm went numb and i can't speak properly", label: emergency}
  - {text: "she's been fitting for five minutes", label: emergency}
  - {text: "i've been stung by a bee and my face is swelling up", label: emergency}
  - {text: "there's blood everywhere he cut himself with a knife", label: emergency}
  - {text: "i'm thinking about ending it all tonight", label: emergency}
  - {text: "my husband isn't breathing", label: emergency}
