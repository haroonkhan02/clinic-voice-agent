[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "AI phone receptionist for a (synthetic) clinic: Twilio Media Streams + Pipecat, Deepgram STT/TTS and Claude tool use, with guardrails and an evaluation harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Haroon Khan" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agent = ["anthropic>=1.13"]
voice = [
    "anthropic>=1.13",
    "pipecat-ai[anthropic,deepgram,silero,websocket]>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cva-check-env = "clinic_voice_agent.cli:check_env_main"
cva-faq = "clinic_voice_agent.cli:faq_main"
cva-faq-eval = "clinic_voice_agent.cli:faq_eval_main"
cva-guardrail-eval = "clinic_voice_agent.cli:guardrail_eval_main"
cva-slots = "clinic_voice_agent.cli:slots_main"
cva-chat = "clinic_voice_agent.cli:chat_main"
cva-eval-calls = "clinic_voice_agent.cli:eval_calls_main"
cva-speech-eval = "clinic_voice_agent.cli:speech_eval_main"
cva-serve = "clinic_voice_agent.server:main"
cva-phone-sim = "clinic_voice_agent.cli:phone_sim_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
