name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Tests need no API keys, microphone, network or speech models: every external
      # service is mocked, so only the light core dependencies are installed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-dotenv pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  voice:
    # The real-time stack (Pipecat, FastAPI) is heavy, so it is checked once on 3.12:
    # the pipeline must assemble and the Twilio webhook must answer, still without any keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with voice extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[voice,dev]"
      - name: Test voice pipeline and server
        run: pytest -q tests/test_voice.py tests/test_agent.py
